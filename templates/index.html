<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TODO List</title>
    <link rel="icon" href="/static/img/icon_todo_logo.svg" type="image/svg+xml">
    <style>
        :root {
            --bg-dark: #0a0f18;
            --card-bg: #151b2b;
            --text-main: #ffffff;
            --text-muted: #6b7280;
            --border-color: #2d3748;
            --neon-cyan: #00ffff;
            --neon-pink: #e838cc;

            /* 重构优先级颜色：红 -> 橙 -> 黄 -> 白 */
            --p1-color: #FF0060; /* 亮红 */
            --p2-color: #00FFDE; /* 亮橙 */
            --p3-color: #FFE8BE; /* 淡黄 */
            --p4-color: #ffffff; /* 纯白 */
        }

        html {
            overflow-anchor: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Consolas, sans-serif;
            margin: 0;
            padding: 10px 10px 160px 10px;
            overflow-anchor: none;
        }

        .header-controls {
            /* 👇 核心新增：吸顶固定特效 */
            position: sticky;
            top: 0; /* 紧贴浏览器视口顶部 */
            background-color: var(--bg-dark); /* 必须加上与网页一致的背景色，否则滚动时文字会重叠 */
            z-index: 100; /* 保证它永远盖在任务列表上方 */
            padding-top: 20px; /* 吸收掉原本 body 的顶部留白 */
            margin-top: -20px; /* 抵消 body 的内边距，让它真正“焊死”在浏览器最顶端 */

            /* 👇 以下是原有的布局属性，保持不变 */
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .left-section, .right-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .year-selector {
            display: flex;
            align-items: center;
            background: #1f2937;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 10px;
            gap: 10px;
            height: 24px;
        }

        .year-text {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
        }

        .year-btn {
            background: transparent;
            border: none;
            color: var(--neon-cyan);
            cursor: pointer;
            font-size: 12px;
            padding: 0 4px;
        }

        .year-btn:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .tag-group {
            display: flex;
            gap: 6px;
        }

        .tag {
            background: #1f2937;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-muted);
            user-select: none;
        }

        .tag.active {
            background: rgba(0, 255, 255, 0.1);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            font-weight: bold;
        }

        .board-columns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
        }

        .month-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 6px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .month-title {
            text-align: center;
            color: var(--neon-cyan);
            font-weight: bold;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
            margin-bottom: 10px;
            font-size: 16px;
        }

        .task-row {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 4px;
            gap: 10px;
            border: 1px solid transparent;
            transition: border 0.2s;
            cursor: default;
        }

        .task-row:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .task-row.selected-row {
            border-color: var(--neon-cyan);
            background: rgba(0, 255, 255, 0.05);
        }

        /* ======== 拖拽特效 CSS ======== */
        .task-row.draggable-enabled:hover {
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.1);
        }

        .drag-handle {
            min-width: 42px;
            align-self: stretch;
            font-family: Consolas;
            color: var(--neon-cyan);
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            margin: -4px 0 -4px -6px;
            touch-action: none;
            user-select: none; /* 防止拖拽时误选中文字 */
            transition: transform 0.15s ease;
            transform-origin: center;
        }

        .drag-handle.can-drag {
            cursor: grab;
        }

        .drag-handle.can-drag:hover,
        .drag-handle.can-drag:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        .task-row.pointer-dragging {
            opacity: 0.45;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.18);
        }

        body.is-reordering {
            cursor: grabbing;
            user-select: none;
        }

        .task-row.drag-over-top {
            box-shadow: 0 -2px 0 var(--neon-cyan);
            z-index: 10;
        }

        .task-row.drag-over-bottom {
            box-shadow: 0 2px 0 var(--neon-cyan);
            z-index: 10;
        }

        /* 复选框：纯正横向的一字贯穿删除线 */
        .cyber-checkbox {
            appearance: none;
            width: 15px;
            height: 15px;
            margin-right: 5px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            cursor: pointer;
            flex-shrink: 0;
            background: transparent;
            transition: all 0.2s;
            position: relative;
        }

        .cyber-checkbox:checked {
            border-color: var(--text-muted);
            opacity: 0.6;
        }

        .cyber-checkbox:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -3px;
            right: -3px;
            height: 2px;
            background-color: var(--text-muted);
            transform: translateY(-50%);
        }

        .task-name-container {
            flex: 1;
            min-width: 0;
        }

        .inline-input {
            background: transparent;
            border: 1px dashed transparent;
            width: 100%;
            outline: none;
            font-size: 14px;
        }

        .task-name-input {
            display: block;
            box-sizing: border-box;
            min-height: 20px;
            line-height: 1.35;
            padding: 0;
            resize: none;
            overflow: hidden;
            font-family: inherit;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .inline-input:focus {
            border-bottom: 1px dashed var(--neon-cyan);
        }

        /* 宽度拉长至85px，彻底解决 5/10 日期显示被截断的问题 */
        .date-input {
            width: 85px;
            text-align: center;
        }

        .priority-btn {
            border: 1px solid currentColor;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            user-select: none;
            width: 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .priority-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .p1-text {
            color: var(--p1-color) !important;
            font-weight: bold !important;
        }

        .p2-text {
            color: var(--p2-color) !important;
            font-weight: bold !important;
        }

        .p3-text {
            color: var(--p3-color) !important;
            font-weight: bold !important;
        }

        .p4-text {
            color: var(--p4-color) !important;
            font-weight: normal !important;
        }

        .strike {
            text-decoration: line-through;
            text-decoration-color: rgba(255, 255, 255, 0.9);
        }

        .btn {
            background: #1f2937;
            color: white;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn:hover {
            border-color: var(--neon-cyan);
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #ff4d4f;
            padding: 0;
        }

        /* 图标按钮样式：无边框无背景，悬浮变大 */
        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
            outline: none;
        }

        .icon-btn:hover {
            transform: scale(1.15);
        }

        .icon-btn img {
            width: 18px;
            height: 18px;
        }

        /* 统计数字的布局 */
        .stat-group {
            display: flex;
            align-items: center;
            gap: 5px;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .stat-group img {
            width: 16px; /* 从20px缩小 */
            height: 16px;
        }

        /* 日历视图布局 */
        .calendar-view {
            display: none;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .calendar-day {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            min-height: 120px;
            padding: 10px;
            border-radius: 6px;
        }

        .calendar-date {
            font-size: 12px;
            color: var(--neon-cyan);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .calendar-task-item {
            font-size: 12px;
            padding: 4px;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 4px;
            border-radius: 3px;
        }

        .tech-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 8, 15, 0.75);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .tech-modal-overlay.show {
            display: flex;
        }

        .tech-modal {
            background: #0B111E;
            border: 1px solid var(--neon-cyan);
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            text-align: center;
            min-width: 350px;
        }

        .modal-btns {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .modal-btns button {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .modal-btns .confirm-btn {
            background: rgba(232, 56, 204, 0.1);
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        /* ======== 全局暗黑科技风滚动条 ======== */
        ::-webkit-scrollbar {
            width: 6px; /* 垂直滚动条的极细宽度 */
            height: 6px; /* 水平滚动条的极细高度 */
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2); /* 轨道背景：极暗的透明黑 */
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.2); /* 滑块：默认微微发出的幽暗青光 */
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 240, 255, 0.6); /* 滑块悬浮：青光变亮，确认感拉满 */
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        ::-webkit-scrollbar-corner {
            background: transparent; /* 右下角交汇处透明 */
        }

        /* ======== 远期目标控件 CSS ======== */
        .lt-goal-container {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            margin-right: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            /* 👇 核心修改：写死宽度 (170px刚好够放10个汉字)，并设为相对定位 */
            width: 220px;
            position: relative;
            overflow: hidden;
        }

        .lt-goal-container:hover {
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.05);
        }

        .lt-goal-input {
            flex: 1;
            min-width: 0; /* 防止文本过长撑破容器 */
            color: var(--p1-color);
            font-size: 13px;
            text-align: left;
            font-weight: bold;
            transition: color 0.2s;
            cursor: pointer;
            padding-left: 2px;
        }

        .lt-goal-input.is-completed {
            color: var(--text-muted);
            font-weight: normal;
            text-decoration: line-through;
            text-decoration-color: rgba(255, 255, 255, 0.4);
        }

        /* 悬浮操作区的动画折叠效果 */
        .lt-goal-actions {
            position: absolute;
            right: 4px;
            display: flex;
            align-items: center;
            gap: 2px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            /* 👇 利用深色背景和阴影遮挡底部的长文字，防止图标和文字重叠在一起看不清 */
            background: #0f1520;
            padding-left: 6px;
            box-shadow: -6px 0 8px #0f1520;
        }

        .lt-goal-actions .tiny-btn {
            padding: 2px;
        }

        .lt-goal-actions .tiny-btn:hover img {
            transform: scale(1.15);
        }

        /* 统一远期目标控件内的所有图标大小，强制 16px 并保持比例 */
        .lt-goal-container img {
            width: 16px !important;
            height: 16px !important;
            object-fit: contain;
            display: block;
            transition: transform 0.2s ease; /* 确保悬浮放大时有丝滑动画 */
        }

        /* 2. 核心黑科技：无视内部留白，直接进行视觉上的精准膨胀 */
        img[alt="Compass"] {
            transform: scale(1.86);
        }

        img[alt="Delete"] {
            transform: scale(1.86);
        }

        img[alt="Add"] {
            transform: scale(0.96);
        }

        img[alt="Finish"] {
            transform: scale(0.9);
        }

        img[alt="Next"] {
            transform: scale(0.9);
        }

        /* 3. 核心修改：鼠标悬浮时，在基础数值上乘以 1.2倍 */
        /* Delete: 1.86 * 1.2 = 2.232 */
        .lt-goal-actions .tiny-btn:hover img[alt="Delete"] {
            transform: scale(2.232);
        }

        /* Add: 0.96 * 1.2 = 1.152 */
        .lt-goal-actions .tiny-btn:hover img[alt="Add"] {
            transform: scale(1.152);
        }

        /* Finish: 0.9 * 1.2 = 1.08 */
        .lt-goal-actions .tiny-btn:hover img[alt="Finish"] {
            transform: scale(1.08);
        }

        /* Next: 0.9 * 1.2 = 1.08 */
        .lt-goal-actions .tiny-btn:hover img[alt="Next"] {
            transform: scale(1.08);
        }

        /* 3. 展开区的宽度微调，确保图标膨胀后彼此之间不会拥挤 */
        .lt-goal-container:hover .lt-goal-actions {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

<div class="header-controls">
    <div class="left-section">
        <div class="year-selector">
            <span class="year-text" id="display-year">2026</span>
            <button class="year-btn" id="btn-prev-year" onclick="changeYear(-1)">▼</button>
            <button class="year-btn" id="btn-next-year" onclick="changeYear(1)">▲</button>
        </div>

        <div class="tag-group" id="quarter-tags"></div>
        <div class="tag-group" id="month-tags" style="display: none;"></div>
    </div>

    <div class="right-section" id="tools-section">
        <span id="shortcut-hint" style="color:var(--text-muted); font-size:12px; margin-right: 15px;">快捷键: Ctrl+Alt+N 新建任务</span>

        <div class="lt-goal-container" id="lt-goal-container">
            <img src="/static/img/icon_compass.svg" class="lt-icon" alt="Compass">

            <input type="text" id="lt-goal-input" class="inline-input lt-goal-input" value="暂无远期目标" readonly
                   onclick="this.removeAttribute('readonly'); this.focus();"
                   onblur="this.setAttribute('readonly', true); updateGoalName(this.value);"
                   onkeydown="if(event.key==='Enter') this.blur();">

            <div class="lt-goal-actions">
                <button class="icon-btn tiny-btn" onclick="completeGoal()" title="标记完成" id="lt-btn-done"
                        style="display:none;">
                    <img src="/static/img/icon_ready_finish.svg" alt="Finish">
                </button>
                <button class="icon-btn tiny-btn" onclick="addGoal()" title="新增远期目标">
                    <img src="/static/img/icon_add.svg" alt="Add">
                </button>
                <button class="icon-btn tiny-btn" onclick="cycleGoal()" title="切换远期目标" id="lt-btn-next"
                        style="display:none;">
                    <img src="/static/img/icon_next.svg" alt="Next">
                </button>
                <button class="icon-btn tiny-btn" onclick="promptDeleteGoal()" title="删除目标" id="lt-btn-del"
                        style="display:none;">
                    <img src="/static/img/icon_delete.svg" alt="Delete">
                </button>
            </div>
        </div>

        <div class="stat-group" title="已完成">
            <img src="/static/img/icon_done.svg" alt="Done" style="width: 15px; height: 15px;">
            <span id="stat-done">0</span>
        </div>

        <div class="stat-group" title="本月已完成">
            <img src="/static/img/icon_done_month.svg" alt="Done Month" style="width: 17px; height: 17px;">
            <span id="stat-done-month">0</span>
        </div>

        <div class="stat-group" title="未完成">
            <img src="/static/img/icon_doing.svg" alt="Doing" style="width: 14px; height: 14px;">
            <span id="stat-doing">0</span>
        </div>

        <button class="icon-btn" title="导出Excel备份" onclick="exportExcel()">
            <img src="/static/img/icon_export_excel.svg" alt="Export" style="width: 16px; height: 16px;">
        </button>

        <button class="icon-btn" title="批量导入任务" onclick="document.getElementById('excelUpload').click()">
            <img src="/static/img/icon_import.svg" alt="Import">
        </button>
        <input type="file" id="excelUpload" style="display: none;" accept=".xlsx" onchange="uploadExcel()">

        <button class="icon-btn" title="切换月份日历" onclick="toggleView()" id="view-switch-btn">
            <img src="/static/img/icon_calendar.svg" alt="Calendar" style="width: 16px; height: 16px;">
        </button>
    </div>
</div>

<!-- 列表视图 -->
<div id="list-view" class="board-columns">
    <div class="month-col">
        <div class="month-title" id="m-title-1">-</div>
        <div id="m-body-1" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
    <div class="month-col">
        <div class="month-title" id="m-title-2">-</div>
        <div id="m-body-2" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
    <div class="month-col">
        <div class="month-title" id="m-title-3">-</div>
        <div id="m-body-3" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
</div>

<!-- 卡片日历视图 -->
<div id="calendar-view" class="calendar-view"></div>

<div class="tech-modal-overlay" id="delete-modal">
    <div class="tech-modal">
        <p style="color: var(--neon-cyan); font-family: Consolas; font-size: 16px; margin-bottom: 20px;">CONFIRMING
            DIALOG</p>
        <p style="font-size: 14px; color: var(--text-main);">确认删除吗？</p>
        <div class="modal-btns">
            <button onclick="closeDeleteModal()">取消</button>
            <button class="confirm-btn" onclick="executeDelete()">确认</button>
        </div>
    </div>
</div>

<div class="tech-modal-overlay" id="delete-goal-modal">
    <div class="tech-modal">
        <p style="color: var(--neon-cyan); font-family: Consolas; font-size: 16px; margin-bottom: 20px;">CONFIRMING
            DIALOG</p>
        <p style="font-size: 14px; color: var(--text-main);">确认删除吗？</p>
        <div class="modal-btns">
            <button onclick="closeDeleteGoalModal()">取消</button>
            <button class="confirm-btn" onclick="executeDeleteGoal()">确认</button>
        </div>
    </div>
</div>

<script>
    let currentYear = new Date().getFullYear();
    let currentQuarter = Math.floor((new Date().getMonth() + 3) / 3);
    let currentMonth = new Date().getMonth() + 1;
    let minYear = currentYear;
    let maxYear = currentYear + 1;
    let isCalendarView = false;
    let tasksData = [];
    let deleteTargetId = null;
    let draggedTaskId = null; // 记录当前拖拽的任务ID
    let pointerDragState = null;
    let isFirstLoad = true; // 用于判断是否为页面首次加载
    let goalsData = [];
    let currentGoalIndex = 0;
    let revertGoalTimer = null; // 全局定时器
    let delayedSortTimer = null; // 用于延迟排序的全局定时器
    let delayedSortTime = 600000; // 延迟重排时间(1秒)
    let pendingDateVisualAnchors = new Map();
    let suppressNextNewTaskAnimation = false;

    // 监听页面可见性（最小化/切换标签页）
    document.addEventListener("visibilitychange", () => {
        // 如果页面不可见，且当前正有排队的重排任务，立刻掐断倒计时并直接执行
        if (document.hidden && delayedSortTimer !== null) {
            clearTimeout(delayedSortTimer);
            delayedSortTimer = null;
            runDelayedSortNow();
        }
    });

    function checkAndRevertToPrincipal() {

    async function loadTasks() {
        const res = await fetch(`/api/tasks?year=${currentYear}`);
        tasksData = await res.json();

        const calRes = await fetch(`/api/calendar?year=${currentYear}`);
        window.calendarData = await calRes.json();

        renderWithAnimation(); // 渲染 DOM

        // ======== 首次刷新页面自动滚动定位 ========
        if (isFirstLoad) {
            isFirstLoad = false; // 保证只有刷新网页时触发，切换年份时不乱滚

            // 延迟 300ms 确保浏览器已经将 DOM 节点绘制到屏幕上
            setTimeout(() => {
                if (isCalendarView) return; // 如果在日历视图就不滚动

                // 1. 找到全局第一个未完成的复选框 (没有 :checked 属性)
                const firstUncompleted = document.querySelector('.cyber-checkbox:not(:checked)');

                if (firstUncompleted) {
                    const currentRow = firstUncompleted.closest('.task-row');
                    const parentContainer = currentRow.parentElement;
                    const rows = Array.from(parentContainer.children);
                    const currentIndex = rows.indexOf(currentRow);

                    // 2. 找到该项的“上 2 项”，如果上面不够 2 项，就取最顶部（第 0 项）
                    const targetIndex = Math.max(0, currentIndex - 2);
                    const targetRow = rows[targetIndex];

                    if (targetRow) {
                        // 3. 计算绝对滚动位置：目标相对视口顶部距离 + 当前滚动高度 - 60px(留点呼吸空间)
                        const y = targetRow.getBoundingClientRect().top + window.scrollY - 60;
                        window.scrollTo({top: y, behavior: 'smooth'});
                    }
                }
            }, 300);
        }
        // ====================================================
    }

    // FLIP动画渲染
    function renderWithAnimation() {
        const skipNewTaskAnimation = suppressNextNewTaskAnimation;
        suppressNextNewTaskAnimation = false;

        // 1. First: 记录渲染前所有任务的当前位置
        const oldPositions = {};
        document.querySelectorAll('.task-row').forEach(row => {
            oldPositions[row.dataset.id] = row.getBoundingClientRect();
        });

        // 2. 正常执行原有的 DOM 渲染，将所有任务排到新的位置
        renderBoard();

        // 如果是日历视图，不执行平滑动画
        if (isCalendarView) return;

        // 3. Last & Invert & Play: 计算位置差并播放丝滑动画
        document.querySelectorAll('.task-row').forEach(row => {
            const id = row.dataset.id;
            const oldRect = oldPositions[id];

            if (oldRect) {
                // 如果是老任务，计算它的位置变化
                const newRect = row.getBoundingClientRect();
                const deltaX = oldRect.left - newRect.left;
                const deltaY = oldRect.top - newRect.top;

                // 只有当位置真的发生变化时才做动画
                if (deltaX !== 0 || deltaY !== 0) {
                    // Invert: 瞬间通过 transform 把新创建的节点“骗”回老位置
                    row.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                    row.style.transition = 'none'; // 移动回老位置时不需要动画

                    // 强制浏览器重绘 (Reflow)
                    row.offsetHeight;

                    // Play: 移除 transform，加上物理缓动，让它自己平滑地滑到新位置
                    row.style.transition = 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
                    row.style.transform = '';

                    // 动画结束后清理内联样式，防止干扰后续的拖拽和 Hover
                    setTimeout(() => {
                        row.style.transition = '';
                    }, 500);
                }
            } else if (!skipNewTaskAnimation) {
                // 如果是全新增加的任务（Ctrl+Alt+N），给个淡入向上的入场动画
                row.style.opacity = '0';
                row.style.transform = 'translateY(10px)';
                row.offsetHeight;
                row.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
                row.style.opacity = '1';
                row.style.transform = '';
                setTimeout(() => {
                    row.style.transition = '';
                }, 400);
            }
        });
    }

    // 全局统计刷新函数 ========
    function updateStats() {
        // 计算全年统计
        const doneCount = tasksData.filter(t => t.is_completed === 1).length;
        const doingCount = tasksData.filter(t => t.is_completed === 0).length;

        // 👇 核心计算：获取当前“所选月份”的已完成任务数
        const doneMonthCount = tasksData.filter(t =>
            t.is_completed === 1 &&
            t.date &&
            parseInt(t.date.substring(5, 7)) === currentMonth
        ).length;

        // 统一更新到页面上
        document.getElementById('stat-done').textContent = doneCount;
        document.getElementById('stat-doing').textContent = doingCount;
        document.getElementById('stat-done-month').textContent = doneMonthCount;
    }

    function renderBoard() {
        updateStats();
        if (isCalendarView) renderCalendarView();
        else renderListView();
    }

    function getTaskRenderDate(task) {
        const anchorDate = pendingDateVisualAnchors.get(String(task.id));
        return anchorDate && !task.is_completed ? anchorDate : task.date;
    }

    function normalizeTaskSortDate(dateStr) {
        const parts = String(dateStr || '').split('-');
        const y = parts[0] || '9999';
        const m = (parts[1] || '99').padStart(2, '0');
        const d = (parts[2] || '99').padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function compareTasksForLocalRender(a, b) {
        const dateA = getTaskRenderDate(a);
        const dateB = getTaskRenderDate(b);
        const keyA = [
            a.is_completed === 1 ? 0 : 1,
            dateA && dateA.endsWith('-99') ? 1 : 0,
            normalizeTaskSortDate(dateA),
            a.sort_order || 0,
            a.id || 0
        ];
        const keyB = [
            b.is_completed === 1 ? 0 : 1,
            dateB && dateB.endsWith('-99') ? 1 : 0,
            normalizeTaskSortDate(dateB),
            b.sort_order || 0,
            b.id || 0
        ];

        for (let i = 0; i < keyA.length; i++) {
            if (keyA[i] < keyB[i]) return -1;
            if (keyA[i] > keyB[i]) return 1;
        }
        return 0;
    }

    function moveTaskToLocalSortPosition(id) {
        const currentIndex = tasksData.findIndex(t => String(t.id) === String(id));
        if (currentIndex === -1) return;

        const [task] = tasksData.splice(currentIndex, 1);
        const insertIndex = tasksData.findIndex(other => compareTasksForLocalRender(task, other) < 0);
        tasksData.splice(insertIndex === -1 ? tasksData.length : insertIndex, 0, task);
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[char]));
    }

    function autoResizeTaskName(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = `${textarea.scrollHeight}px`;
    }

    function captureViewportAnchor(preferredRows = null) {
        if (isCalendarView) return null;

        const candidates = preferredRows
            ? (Array.isArray(preferredRows) ? preferredRows.filter(Boolean) : [preferredRows])
            : Array.from(document.querySelectorAll('.task-row'));

        let anchorRow = candidates.find(row => {
            const rect = row.getBoundingClientRect();
            return rect.bottom > 80 && rect.top < window.innerHeight;
        });

        if (!anchorRow) {
            anchorRow = Array.from(document.querySelectorAll('.task-row')).find(row => {
                const rect = row.getBoundingClientRect();
                return rect.bottom > 80 && rect.top < window.innerHeight;
            });
        }

        if (!anchorRow) return null;
        return {
            id: anchorRow.dataset.id,
            top: anchorRow.getBoundingClientRect().top
        };
    }

    function restoreViewportAnchor(anchor) {
        if (!anchor || isCalendarView) return;
        const anchorRow = document.querySelector(`.task-row[data-id='${anchor.id}']`);
        if (!anchorRow) return;

        const targetScrollY = anchorRow.getBoundingClientRect().top + window.scrollY - anchor.top;
        if (targetScrollY !== window.scrollY) {
            window.scrollTo({top: Math.max(0, targetScrollY), behavior: 'auto'});
        }
    }

    function formatDateDisplay(dateStr) {
        if (!dateStr || dateStr.endsWith('-99')) return '';
        let parts = dateStr.split('-');
        return `${parts[0]}-${parseInt(parts[1])}-${parseInt(parts[2])}`;
    }

    function getHintDate(dateStr) {
        // 如果没有具体日期 (待定 -99)，提示当天日期
        if (!dateStr || dateStr.endsWith('-99')) {
            const today = new Date();
            return `${today.getMonth() + 1}/${today.getDate()}`;
        }
        // 如果已经有日期，依然提示原来的日期
        let parts = dateStr.split('-');
        return `${parseInt(parts[1])}/${parseInt(parts[2])}`;
    }

    async function cyclePriority(id, currentP) {
        let nextP;
        if (currentP === 4) nextP = 3;
        else if (currentP === 3) nextP = 2;
        else if (currentP === 2) nextP = 1;
        else nextP = 4;

        // 1. 纯前端手动修改当前任务的 DOM 样式，实现立刻变色且不闪烁
        const row = document.querySelector(`.task-row[data-id='${id}']`);
        if (row) {
            // 更新优先级按钮本身
            const pBtn = row.querySelector('.priority-btn');
            if (pBtn) {
                pBtn.classList.remove(`p${currentP}-text`);
                pBtn.classList.add(`p${nextP}-text`);
                pBtn.textContent = `P${nextP}`;
                // 核心：更新绑定的点击事件，把下一次点击需要的 currentP 传进去
                pBtn.setAttribute('onclick', `event.stopPropagation(); cyclePriority(${id}, ${nextP})`);
            }

            // 更新同行内的任务名称和日期文本的颜色
            const inputs = row.querySelectorAll('.inline-input');
            inputs.forEach(input => {
                input.classList.remove(`p${currentP}-text`);
                input.classList.add(`p${nextP}-text`);
            });
        }

        // 2. 通知后端更新数据库，并传入 skipReload = true
        // 这样就不会触发 loadTasks()，保护了未完成的延迟重排倒计时
        await updateTask(id, 'priority', nextP, true);
    }

    // 处理勾选：不再隐藏复选框，直接赋 strike 划线样式
    async function toggleComplete(id, isCompleted) {
        // 先获取本地任务数据，方便后续判断
        const task = tasksData.find(t => t.id === id);
        if (!task) return;

        const row = document.querySelector(`.task-row[data-id='${id}']`);
        const viewportAnchor = captureViewportAnchor(
            row ? [row.nextElementSibling, row.previousElementSibling] : null
        );
        if (row) {
            const targets = row.querySelectorAll('.inline-input, .priority-btn');
            if (isCompleted) targets.forEach(el => el.classList.add('strike'));
            else targets.forEach(el => el.classList.remove('strike'));
        }

        // 构造请求数据
        const payload = {is_completed: isCompleted ? 1 : 0};

        if (isCompleted) {
            payload.priority = 4; // 打钩完成时，优先级自动降为 4

            // 👇 核心新增逻辑：如果是完成状态，且没有具体日期（即以 -99 结尾的待定状态）
            if (task.date && task.date.endsWith('-99')) {
                const today = new Date();
                const y = today.getFullYear();
                const m = String(today.getMonth() + 1).padStart(2, '0');
                const d = String(today.getDate()).padStart(2, '0');
                const todayStr = `${y}-${m}-${d}`;

                payload.date = todayStr; // 将今天日期加到发送给后端的包里
                task.date = todayStr;    // 同步更新本地状态
            }
        }

        // 发送更新请求
        await fetch(`/api/tasks/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        // 本地数据同步更新剩余状态
        task.is_completed = isCompleted ? 1 : 0;
        if (isCompleted) task.priority = 4;

        // 只让当前勾选的任务立刻按完成状态移动；其它改过日期的未完成任务继续等待延迟重排
        pendingDateVisualAnchors.delete(String(id));
        moveTaskToLocalSortPosition(id);
        renderWithAnimation();
        restoreViewportAnchor(viewportAnchor);
    }

    function renderListView() {
        const startMonth = currentQuarter * 3 - 2;
        const targetMonths = [startMonth, startMonth + 1, startMonth + 2];

        for (let i = 0; i < 3; i++) {
            let m = targetMonths[i];
            document.getElementById(`m-title-${i + 1}`).textContent = `${m}月`;
            const mBody = document.getElementById(`m-body-${i + 1}`);
            mBody.innerHTML = '';

            let monthTasks = tasksData.filter(t => parseInt(String(getTaskRenderDate(t) || '').substring(5, 7)) === m);

            monthTasks.forEach((task, index) => {
                const visualId = index + 1;
                const row = createTaskRowElement(task, visualId);
                mBody.appendChild(row);
            });
        }
    }

    // 局部追加任务行，避免快捷键新建时重绘整板。
    function isTaskDraggable(task) {
        return !!task && !task.is_completed && typeof task.date === 'string' && task.date.endsWith('-99');
    }

    function syncTaskRowDragState(id) {
        const task = tasksData.find(t => String(t.id) === String(id));
        const row = document.querySelector(`.task-row[data-id='${id}']`);
        if (!task || !row) return;

        const canDrag = isTaskDraggable(task);
        const handle = row.querySelector('.drag-handle');

        row.classList.toggle('draggable-enabled', canDrag);
        row.ondragover = canDrag ? (e) => handleDragOver(e, task.id) : null;
        row.ondragleave = canDrag ? (e) => handleDragLeave(e) : null;
        row.ondrop = canDrag ? (e) => handleDrop(e, task.id) : null;

        if (handle) {
            handle.classList.toggle('can-drag', canDrag);
            handle.title = canDrag ? '按住此处拖拽排序' : '';
            if (canDrag) {
                handle.setAttribute('onpointerdown', `startPointerDrag(event, ${task.id})`);
            } else {
                handle.removeAttribute('onpointerdown');
            }
        }
    }

    function createTaskRowElement(task, visualId) {
        const row = document.createElement('div');
        row.className = `task-row`;
        row.dataset.id = task.id;

        const strikeClass = task.is_completed ? 'strike' : '';
        const safeTaskName = escapeHtml(task.name);
        const isDraggable = isTaskDraggable(task);

        if (isDraggable) {
            row.classList.add('draggable-enabled');
            row.ondragover = (e) => handleDragOver(e, task.id);
            row.ondragleave = (e) => handleDragLeave(e);
            row.ondrop = (e) => handleDrop(e, task.id);
        }

        row.innerHTML = `
            <div class="${isDraggable ? 'drag-handle can-drag' : 'drag-handle'}"
                 title="${isDraggable ? '按住此处拖拽排序' : ''}"
                 ${isDraggable ? `onpointerdown="startPointerDrag(event, ${task.id})"` : ''}>
                #${String(visualId).padStart(2, '0')}
            </div>

            <input type="checkbox" class="cyber-checkbox" ${task.is_completed ? 'checked' : ''}
                   onclick="event.stopPropagation(); toggleComplete(${task.id}, this.checked)">

            <div class="task-name-container">
                <textarea rows="1" class="inline-input task-name-input p${task.priority}-text ${strikeClass}"
                       onclick="event.stopPropagation();"
                       onfocus="this.dataset.old = this.value; autoResizeTaskName(this);"
                       oninput="autoResizeTaskName(this);"
                       onblur="if(this.value !== this.dataset.old) { this.dataset.old = this.value; updateTask(${task.id}, 'name', this.value, true); }"
                       onkeydown="if(event.key==='Enter') { event.preventDefault(); this.blur(); } else if(event.key==='Tab') { event.preventDefault(); this.closest('.task-row').querySelector('.date-input').focus(); }">${safeTaskName}</textarea>
            </div>

            <div class="priority-btn p${task.priority}-text ${strikeClass}" onclick="event.stopPropagation(); cyclePriority(${task.id}, ${task.priority})">
                P${task.priority}
            </div>

            <input type="text" class="inline-input date-input p${task.priority}-text ${strikeClass}"
               value="${formatDateDisplay(task.date)}"
               onclick="event.stopPropagation();"
               onfocus="this.value=''; this.placeholder=getHintDate('${task.date}');"
               onblur="handleDateBlur(${task.id}, this, '${task.date}')"
               onkeydown="if(event.key==='Enter') { this.dataset.enterPressed = 'true'; this.blur(); }">

            <button class="action-btn" onclick="event.stopPropagation(); promptDelete(${task.id})">×</button>
        `;

        autoResizeTaskName(row.querySelector('.task-name-input'));
        return row;
    }

    function appendTaskToListView(task) {
        const month = parseInt(task.date.substring(5, 7), 10);
        const startMonth = currentQuarter * 3 - 2;
        const bodyIndex = month - startMonth + 1;

        if (bodyIndex < 1 || bodyIndex > 3) {
            renderBoard();
            return document.querySelector(`.task-row[data-id='${task.id}']`);
        }

        const mBody = document.getElementById(`m-body-${bodyIndex}`);
        const row = createTaskRowElement(task, mBody.children.length + 1);
        mBody.appendChild(row);
        updateStats();
        return row;
    }

    // 农历与节假日解析引擎（免三方库原生计算）
    function getLunarDateStr(year, month, day) {
        try {
            const d = new Date(year, month - 1, day);
            const formatter = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', {month: 'long', day: 'numeric'});
            let parts = formatter.formatToParts(d);
            let lunarMonth = parts.find(p => p.type === 'month')?.value || '';
            let lunarDay = parts.find(p => p.type === 'day')?.value || '';
            let lunarStr = lunarMonth + lunarDay;

            // 简单中国传统节假日映射
            const holidays = {
                "正月初一": "春节", "正月十五": "元宵节",
                "五月初五": "端午节", "七月初七": "七夕节",
                "八月十五": "中秋节", "九月初九": "重阳节",
                "腊月初八": "腊八节", "腊月三十": "除夕"
            };
            // 阳历节假日
            const solarHolidays = {
                "1-1": "元旦", "4-4": "清明节", "4-5": "清明节",
                "5-1": "劳动节", "10-1": "国庆节"
            };

            let holiday = holidays[lunarStr] || solarHolidays[`${month}-${day}`];
            return holiday ? `${lunarStr}(${holiday})` : lunarStr;
        } catch (e) {
            return '';
        }
    }

    function renderCalendarView() {
        const cal = document.getElementById('calendar-view');
        cal.innerHTML = '';

    function handleDateBlur(id, inputElem, staleHtmlDate) {
        // 👇 核心修复 1：绝对不信任 HTML 传来的旧日期，直接去本地数据源拿最新状态！
        // 这样即使在 5 分钟的延迟重排期间内反复操作，也绝不会读到“鬼影”数据。
        const task = tasksData.find(t => t.id === id);
        if (!task) return;
        const originalDate = task.date;

        let val = inputElem.value.trim();
        inputElem.placeholder = ''; // 清理占位符

        // 获取并消费回车标记
        const isEnterPressed = inputElem.dataset.enterPressed === 'true';
        inputElem.dataset.enterPressed = 'false';

        // ================= 场景 1：用户没有输入任何内容 (清空了输入框) =================
        if (!val) {
            if (isEnterPressed) {
                // 【情况A】回车 + 空值：用户的明确指令，覆盖为空（置为当前月份的待定）
                const parts = originalDate.split('-');
                let m = currentMonth;
                if (parts.length >= 2) m = parseInt(parts[1], 10);
                const tbdDateStr = `${currentYear}-${String(m).padStart(2, '0')}-99`;

                if (originalDate !== tbdDateStr) {
                    inputElem.value = formatDateDisplay(tbdDateStr);
                    updateTask(id, 'date', tbdDateStr);
                } else {
                    inputElem.value = formatDateDisplay(originalDate);
                }
            } else {
                // 【情况B】失去焦点 + 空值：当作误触，绝对不更新，恢复原样
                inputElem.value = formatDateDisplay(originalDate);
            }
            return; // 结束判定
        }

        // ================= 场景 2：用户输入了内容 =================
        // 基础格式校验 (必须是 1~2位数字 /或- 1~2位数字)
        const match = val.match(/^(\d{1,2})[\/-](\d{1,2})$/);

        if (!match) {
            // 【情况C】格式非日期（比如乱敲的字母）：不更新该日期，恢复原样
            inputElem.value = formatDateDisplay(originalDate);
            return;
        }

        const m = parseInt(match[1], 10);
        const d = parseInt(match[2], 10);

        // 逻辑校验：检查月份和天数是否合法 (拒绝 13/45 这种离谱日期)
        const daysInMonth = new Date(currentYear, m, 0).getDate();
        if (m < 1 || m > 12 || d < 1 || d > daysInMonth) {
            // 【情况D】日期不合法：不更新该日期，恢复原样
            inputElem.value = formatDateDisplay(originalDate);
            return;
        }

        // 【情况E】格式正确且合法：准备更新为输入的日期！
        const finalDateStr = `${currentYear}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

        if (finalDateStr === originalDate) {
            // 如果填的日期和本来的一模一样，直接恢复显示，不浪费网络请求
            inputElem.value = formatDateDisplay(originalDate);
            return;
        }

        // 彻底通过校验，不论是回车还是失去焦点，都触发更新！
        inputElem.value = formatDateDisplay(finalDateStr);
        updateTask(id, 'date', finalDateStr);
    }

    async function addNewRow() {
        const realMonth = new Date().getMonth() + 1;
        let targetMonth = realMonth;

        // 智能分配：只有当真实的月份不在当前显示的季度中时，才退化加到当前季度的首月
        if (!isCalendarView) {
            const startMonth = currentQuarter * 3 - 2;
            if (realMonth < startMonth || realMonth > startMonth + 2) {
                targetMonth = startMonth;
            }
        } else {
            targetMonth = currentMonth;
        }

        const dateStr = `${currentYear}-${String(targetMonth).padStart(2, '0')}-99`;
        const shouldRevealNewRow = !isCalendarView &&
            window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 120;
        const response = await fetch('/api/tasks', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: "", date: dateStr, priority: 4})
        });

        // --- 核心修改：获取新建任务的 ID，并等待页面渲染完成后自动聚焦 ---
        const data = await response.json();
        const newTask = {id: data.id, name: "", date: dateStr, priority: 4, is_completed: 0};
        tasksData.push(newTask);
        let newRowInput = null;
        if (isCalendarView) {
            suppressNextNewTaskAnimation = true;
            await loadTasks(); // 加上 await，等待列表重新渲染完成

        } else {
            const newRow = appendTaskToListView(newTask);
            newRowInput = newRow ? newRow.querySelector('.task-name-input') : null;
        }

        requestAnimationFrame(() => {
            // 通过 ID 找到刚刚新建的那个任务的输入框，并触发 focus
            if (newRowInput) {
                try {
                    newRowInput.focus({preventScroll: true});
                } catch (err) {
                    newRowInput.focus();
                }
                if (shouldRevealNewRow) {
                    newRowInput.scrollIntoView({behavior: 'auto', block: 'nearest'});
                }
            }
        });
    }

    async function updateTask(id, field, value, skipReload = false) {
        let payload = {};
        payload[field] = value;
        await fetch(`/api/tasks/${id}`, {
            method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
        });

        // 先同步本地数据，防止延迟期间拖拽或操作读取到旧数据
        const task = tasksData.find(t => t.id === id);
        if (task) {
            if (field === 'date') {
                const taskKey = String(id);
                if (!pendingDateVisualAnchors.has(taskKey)) {
                    pendingDateVisualAnchors.set(taskKey, task.date);
                }
            }

            task[field] = value;

            if (field === 'date' && pendingDateVisualAnchors.get(String(id)) === value) {
                pendingDateVisualAnchors.delete(String(id));
            }

            if (field === 'date' || field === 'is_completed') {
                syncTaskRowDragState(id);
            }
        }

        if (skipReload) {
            // 保持原样：静默更新（比如失去焦点保存名字），不刷新
            return;
        }

        if (field === 'date') {
            // 核心需求：改日期 -> 触发延迟重排
            scheduleDelayedSort();
        } else {
            // 其它保持原样：比如改优先级 (field === 'priority') -> 保持之前的立刻刷新重排
            loadTasks();
        }
    }

    // --- 拖拽逻辑函数 ---
    async function reorderDraggedTask(draggedId, targetId, insertAfter) {
        if (!draggedId || !targetId || String(draggedId) === String(targetId)) return false;

        const draggedTask = tasksData.find(t => String(t.id) === String(draggedId));
        const targetTask = tasksData.find(t => String(t.id) === String(targetId));
        if (!draggedTask || !targetTask) return false;

        const targetMonth = parseInt(targetTask.date.substring(5, 7));
        let monthUndated = tasksData.filter(t =>
            !t.is_completed &&
            t.date.endsWith('-99') &&
            parseInt(t.date.substring(5, 7)) === targetMonth
        );

        const fromIdx = monthUndated.findIndex(t => String(t.id) === String(draggedId));
        const toIdx = monthUndated.findIndex(t => String(t.id) === String(targetId));
        if (fromIdx === -1 || toIdx === -1) return false;

        monthUndated.splice(fromIdx, 1);
        const newToIdx = monthUndated.findIndex(t => String(t.id) === String(targetId));
        monthUndated.splice(insertAfter ? newToIdx + 1 : newToIdx, 0, draggedTask);

        const orderedIds = monthUndated.map(t => t.id);
        await fetch('/api/tasks/reorder', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ids: orderedIds})
        });
        await loadTasks();
        return true;
    }

    function clearDragIndicators() {
        document.querySelectorAll('.task-row').forEach(r => {
            r.classList.remove('drag-over-top', 'drag-over-bottom', 'pointer-dragging');
        });
    }

    function startPointerDrag(e, id) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        const row = e.currentTarget.closest('.task-row');
        if (!row || !row.classList.contains('draggable-enabled')) return;

        e.preventDefault();
        e.stopPropagation();
        window.getSelection().removeAllRanges();

        draggedTaskId = id;
        pointerDragState = {
            id,
            row,
            startX: e.clientX,
            startY: e.clientY,
            targetId: null,
            insertAfter: false,
            isDragging: false
        };

        e.currentTarget.setPointerCapture?.(e.pointerId);
        document.addEventListener('pointermove', handlePointerDragMove);
        document.addEventListener('pointerup', finishPointerDrag);
        document.addEventListener('pointercancel', cancelPointerDrag);
    }

    function handlePointerDragMove(e) {
        if (!pointerDragState) return;

        e.preventDefault();
        const dx = e.clientX - pointerDragState.startX;
        const dy = e.clientY - pointerDragState.startY;

        if (!pointerDragState.isDragging) {
            if (Math.hypot(dx, dy) < 4) return;
            pointerDragState.isDragging = true;
            pointerDragState.row.classList.add('pointer-dragging');
            document.body.classList.add('is-reordering');
        }

        updatePointerDragTarget(e.clientX, e.clientY);
        autoScrollDuringPointerDrag(e.clientY);
    }

    function updatePointerDragTarget(clientX, clientY) {
        if (!pointerDragState) return;

        document.querySelectorAll('.task-row').forEach(r => {
            if (r !== pointerDragState.row) {
                r.classList.remove('drag-over-top', 'drag-over-bottom');
            }
        });

        const targetRow = document.elementFromPoint(clientX, clientY)?.closest('.task-row.draggable-enabled');
        if (!targetRow || targetRow === pointerDragState.row) {
            pointerDragState.targetId = null;
            return;
        }

        const bounding = targetRow.getBoundingClientRect();
        const insertAfter = clientY - bounding.top > bounding.height / 2;

        targetRow.classList.toggle('drag-over-top', !insertAfter);
        targetRow.classList.toggle('drag-over-bottom', insertAfter);
        pointerDragState.targetId = targetRow.dataset.id;
        pointerDragState.insertAfter = insertAfter;
    }

    function autoScrollDuringPointerDrag(clientY) {
        const edge = 90;
        const speed = 14;
        if (clientY < edge) {
            window.scrollBy({top: -speed, behavior: 'auto'});
        } else if (clientY > window.innerHeight - edge) {
            window.scrollBy({top: speed, behavior: 'auto'});
        }
    }

    async function finishPointerDrag(e) {
        if (!pointerDragState) return;

        e.preventDefault();
        const state = pointerDragState;
        cleanupPointerDrag();

        if (state.isDragging && state.targetId) {
            await reorderDraggedTask(state.id, state.targetId, state.insertAfter);
        }
    }

    function cancelPointerDrag() {
        cleanupPointerDrag();
    }

    function cleanupPointerDrag() {
        document.removeEventListener('pointermove', handlePointerDragMove);
        document.removeEventListener('pointerup', finishPointerDrag);
        document.removeEventListener('pointercancel', cancelPointerDrag);
        document.body.classList.remove('is-reordering');
        clearDragIndicators();
        pointerDragState = null;
        draggedTaskId = null;
    }

    function handleDragStart(e, id) {
        draggedTaskId = id;

        // 👇 核心修复：立即清空屏幕上所有不小心中伤、框选的文本蓝块，回归纯净拖拽
        window.getSelection().removeAllRanges();

        // e.target 现在就是那个小编号 div，我们顺藤摸瓜找到整行
        const row = e.target.closest('.task-row');
        if (row) {
            row.style.opacity = '0.4';
            // 核心黑科技：虽然你只拖拽了编号，但我们强制把跟着鼠标飘的“残影”设置为整行
            e.dataTransfer.setDragImage(row, 20, 20);
        }
        e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnd(e) {
        const row = e.target.closest('.task-row');
        if (row) {
            row.style.opacity = '1';
        }
        document.querySelectorAll('.task-row').forEach(r => r.classList.remove('drag-over-top', 'drag-over-bottom'));
        draggedTaskId = null;
    }

    function handleDragOver(e, id) {
        e.preventDefault();
        if (id === draggedTaskId) return;

        // 👇 核心修复：精准排他！在亮起当前行之前，强制拔掉其他所有行的发光状态，防止多行同时亮起
        document.querySelectorAll('.task-row').forEach(r => {
            if (r !== e.currentTarget) {
                r.classList.remove('drag-over-top', 'drag-over-bottom');
            }
        });

        const row = e.currentTarget;
        const bounding = row.getBoundingClientRect();
        const offset = e.clientY - bounding.top;
        if (offset > bounding.height / 2) {
            row.classList.remove('drag-over-top');
            row.classList.add('drag-over-bottom');
        } else {
            row.classList.remove('drag-over-bottom');
            row.classList.add('drag-over-top');
        }
    }

    function handleDragLeave(e) {
        e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
    }

    async function handleDrop(e, targetId) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
        if (!draggedTaskId || draggedTaskId === targetId) return;

        const row = e.currentTarget;
        const bounding = row.getBoundingClientRect();
        const offset = e.clientY - bounding.top;
        const insertAfter = offset > bounding.height / 2;

        await reorderDraggedTask(draggedTaskId, targetId, insertAfter);
    }

    async function loadGoals() {

                currentGoalIndex = 0;
                await fetch(`/api/goals/${goalsData[0].id}/set_principal`, {method: 'POST'});

            const goalId = goalsData[currentGoalIndex].id;
            await fetch(`/api/goals/${goalId}`, {
                method: 'PUT', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({is_completed: 1})
            });
            await loadGoals();
        }
    }

    async function updateGoalName(newName) {
        if (currentGoalIndex >= 0 && goalsData.length > 0) {
            const goalId = goalsData[currentGoalIndex].id; // 记住当前刚编辑完的目标 ID
            const goal = goalsData[currentGoalIndex];

            if (goal.name !== newName.trim() && newName.trim() !== '') {
                await fetch(`/api/goals/${goal.id}`, {
                    method: 'PUT', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: newName.trim()})
                });

                await loadGoals(); // 注意：这里 loadGoals 默认会强行切回主要矛盾

                // 👇 所以我们要强行把游标拉回到刚刚修改的这个目标上，不让它立刻跳走
                currentGoalIndex = goalsData.findIndex(g => g.id === goalId);
                if (currentGoalIndex !== -1) renderCurrentGoal();

            } else if (newName.trim() === '') {
                renderCurrentGoal();
            }

            // 👇 核心新增：无论是改了名字还是没改，只要完成编辑动作，就触发 5 秒回退倒计时
            checkAndRevertToPrincipal();
        }
    }

    async function cycleGoal() {
        if (goalsData.length > 1) {
            // 1. 计算出下一个目标的索引
            currentGoalIndex = (currentGoalIndex + 1) % goalsData.length;
            const targetGoal = goalsData[currentGoalIndex];

            // 👇 核心修改 3：切换时立刻通知后端将此目标在数据库中置为主要矛盾
            await fetch(`/api/goals/${targetGoal.id}/set_principal`, {method: 'POST'});

            // 2. 重新加载远期目标列表，确保前后端完全同步并重绘 UI
            loadGoals();
        }
    }


</script>
